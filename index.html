<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adelphotis Line - Marketplace Angola</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<!-- HEADER -->
<header class="bg-blue-700 text-white p-4 sticky top-0 z-50 shadow-lg">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold"><i class="fa-solid fa-store"></i> Adelphotis Line</h1>
    <button onclick="abrirModal()" class="bg-yellow-400 text-blue-900 px-4 py-2 rounded-full font-bold">
      <i class="fa-solid fa-plus"></i> Vender
    </button>
  </div>
</header>

<!-- HERO -->
<div class="bg-blue-700 text-white text-center py-10 px-4">
  <h2 class="text-3xl font-bold">Marketplace de Angola</h2>
  <p class="mt-2">Compra e venda tudo aqui - Todo mundo pode vender!</p>
  <input id="busca" onkeyup="filtrar()" type="text" placeholder="O que você procura? ex: telefone, carro, roupa..." class="mt-4 w-full max-w-xl p-3 rounded-full text-black text-center">
</div>

<!-- CATEGORIAS -->
<div class="max-w-7xl mx-auto p-4 flex gap-2 overflow-x-auto">
  <button onclick="filtroCat('todos')" class="cat bg-blue-700 text-white px-4 py-2 rounded-full whitespace-nowrap">Todos</button>
  <button onclick="filtroCat('telemoveis')" class="cat bg-white px-4 py-2 rounded-full whitespace-nowrap">Telemóveis</button>
  <button onclick="filtroCat('carros')" class="cat bg-white px-4 py-2 rounded-full whitespace-nowrap">Carros</button>
  <button onclick="filtroCat('roupas')" class="cat bg-white px-4 py-2 rounded-full whitespace-nowrap">Roupas</button>
  <button onclick="filtroCat('casa')" class="cat bg-white px-4 py-2 rounded-full whitespace-nowrap">Casa</button>
  <button onclick="filtroCat('outros')" class="cat bg-white px-4 py-2 rounded-full whitespace-nowrap">Outros</button>
</div>

<!-- PRODUTOS -->
<div id="produtos" class="max-w-7xl mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4">
</div>

<!-- MODAL VENDER -->
<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl p-6 w-full max-w-md">
    <h3 class="text-xl font-bold mb-4">Vender seu Produto</h3>
    <input id="nome" placeholder="Nome do produto" class="w-full border p-2 rounded mb-2">
    <input id="preco" type="number" placeholder="Preço em Kz" class="w-full border p-2 rounded mb-2">
    <select id="categoria" class="w-full border p-2 rounded mb-2">
      <option value="telemoveis">Telemóveis</option>
      <option value="carros">Carros</option>
      <option value="roupas">Roupas</option>
      <option value="casa">Casa</option>
      <option value="outros">Outros</option>
    </select>
    <input id="whatsapp" placeholder="Seu WhatsApp ex: 923000000" class="w-full border p-2 rounded mb-2">
    <input id="imagem" placeholder="Link da imagem (ou deixa vazio)" class="w-full border p-2 rounded mb-2">
    <div class="flex gap-2">
      <button onclick="fecharModal()" class="flex-1 bg-gray-300 p-2 rounded">Cancelar</button>
      <button onclick="adicionarProduto()" class="flex-1 bg-blue-700 text-white p-2 rounded">Publicar</button>
    </div>
  </div>
</div>
